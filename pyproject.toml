[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immo"
version = "0.1.0"
description = "Property search automation for Baden-Baden (DE) and Alsace (FR)"
requires-python = ">=3.11"
dependencies = [
    # Playwright >=1.49 has reliable `install --with-deps` support on Ubuntu 24.04 (noble).
    "playwright>=1.49,<2.0",
    # Pinned <2.0: code uses the 1.x stealth_async API (2.x is a breaking rename).
    "playwright-stealth>=1.0.6,<2.0",
    "httpx>=0.25,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=4.9,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "jinja2>=3.1,<4.0",
    "plotly>=5.18,<6.0",
    # kaleido dropped: static image export (to_image/write_image) is unused; charts
    # are emitted as interactive HTML via fig.to_html().
    "weasyprint>=62,<70",
    "streamlit>=1.29,<2.0",
    "rich>=13.7,<14.0",
    "thefuzz[speedup]>=0.20,<1.0",
    "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
captcha = ["twocaptcha-python>=1.0"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[project.scripts]
immo = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]
