[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "immo"
version = "0.1.0"
description = "Property search automation for Baden-Baden (DE) and Alsace (FR)"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "playwright-stealth>=1.0.6",
    "httpx>=0.25",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "plotly>=5.18",
    "kaleido>=0.2",
    "weasyprint>=60",
    "streamlit>=1.29",
    "rich>=13.7",
    "thefuzz[speedup]>=0.20",
    "pydantic>=2.5",
]

[project.optional-dependencies]
captcha = ["twocaptcha-python>=1.0"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[project.scripts]
immo = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]
