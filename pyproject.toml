[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immo"
version = "0.1.0"
description = "Property search automation for Baden-Baden (DE) and Alsace (FR)"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40,<2.0",
    "playwright-stealth>=1.0.6,<2.0",
    "httpx>=0.25,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=4.9,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "jinja2>=3.1,<4.0",
    "plotly>=5.18,<6.0",
    "kaleido>=0.2,<1.0",
    "weasyprint>=60,<70",
    "streamlit>=1.29,<2.0",
    "rich>=13.7,<14.0",
    "thefuzz[speedup]>=0.20,<1.0",
    "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
captcha = ["twocaptcha-python>=1.0"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[project.scripts]
immo = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]
