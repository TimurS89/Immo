# Country-keyed configuration. Add a country = add an entry here (no code changes).
# DE and FR are kept for the cross-border option but DISABLED by default.
# Luxembourg (LU) is auto-registered (enabled) from config/luxembourg.py — the
# non-negotiable hard values (communes, filters, weights, DWS office) live there,
# not here. Add an "LU:" block below only to override the defaults.
search_areas:
  DE:
    enabled: false            # cross-border option, off by default
    currency: EUR
    locale: de-DE
    timezone: Europe/Berlin
    regions: ["Baden-Baden"]
    areas:
      - name: "Baden-Baden"
        city: "Baden-Baden"
        postal_codes: ["76530", "76532", "76534"]
        radius_km: 0
    portals:
      - {name: immoscout24, enabled: true}
      - {name: immowelt, enabled: true}
      - {name: kleinanzeigen, enabled: true}
      - {name: wohnungsboerse, enabled: true}

  FR:
    enabled: false            # cross-border option, off by default
    currency: EUR
    locale: fr-FR
    timezone: Europe/Paris
    regions: ["67", "68"]
    areas:
      - name: "Alsace"
        departments: ["67", "68"]
    portals:
      - {name: leboncoin, enabled: true}
      - {name: seloger, enabled: true}
      - {name: bienici, enabled: true}
      - {name: pap, enabled: true}
      - {name: paruvendu, enabled: true}

filters:
  buy:
    min_price: 0
    max_price: 1000000
    min_rooms: 3
    min_area_sqm: 50
    property_types: ["apartment", "house", "land"]
  rent:
    min_price: 0
    max_price: 2500
    min_rooms: 3
    min_area_sqm: 50
    property_types: ["apartment", "house"]

scrapers:
  request_delay_seconds: [3, 8]
  max_pages_per_source: 20
  headless: true
  captcha_service: null

reports:
  output_dir: "./data/reports"
  email:
    enabled: true
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    sender_email: "${GMAIL_ADDRESS}"
    sender_password: "${GMAIL_APP_PASSWORD}"
    recipient_email: "${RECIPIENT_EMAIL}"

proxy:
  enabled: false
  type: "residential"
  file: "./config/proxies.txt"

dashboard:
  port: 8501
  host: "127.0.0.1"

database:
  path: "./data/immo.db"

logging:
  level: "INFO"
  file: "./logs/immo.log"
